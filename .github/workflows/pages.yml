# Builds the election map (visualizer/) and publishes it to GitHub Pages.
#
# One-time setup by a repo admin: Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
# Until then the map still builds on every push (a free type-check), and the deploy is skipped
# with a notice instead of failing. Actions are pinned to commit SHAs; the comment gives the release.
name: Deploy election map

on:
  push:
    branches: [main]
    paths:
      - "visualizer/**"
      - "models/**/predictions.csv"
      - "models/**/README.md"
      - "models/**/results/*.csv"
      - "submission/*.csv"
      - "data/raw/downballot/downballot_202[46]_lines_*.csv"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    outputs:
      deploy: ${{ steps.pages.outputs.enabled }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.20.0
          cache: npm
          cache-dependency-path: visualizer/package-lock.json

      - name: Install
        working-directory: visualizer
        run: npm ci --no-audit --no-fund

      - name: Type-check and build
        working-directory: visualizer
        run: npm run build

      - name: Check that GitHub Pages is set to deploy from Actions
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          build_type=$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq .build_type 2>/dev/null || true)
          if [ "$build_type" = "workflow" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Not deployed::The map built, but GitHub Pages isn't set to deploy from Actions (found: ${build_type:-Pages off}). A repo admin can turn it on under Settings > Pages > Source: GitHub Actions."
          fi

      - name: Upload the site
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: visualizer/dist

  deploy:
    needs: build
    if: needs.build.outputs.deploy == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
